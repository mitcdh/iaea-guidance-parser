[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iaea-guidance-parser"
version = "0.4.0"
description = "Precompute structural indexes and Custom GPT knowledge inputs for IAEA guidance PDF directories and individual PDFs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24",
  "PyYAML>=6.0",
  "typer>=0.9",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
iaea-guidance-parser = "iaea_guidance_parser.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
