  heading_continuations:
    - pdf_pages: [20]
      lines:
        - "ESSENTIAL ELEMENT 12: SUSTAINING A NUCLEAR SECURITY"
        - "REGIME"

  # Definitions end on page 25; page 26 is blank, and ordering pages start on 27.
  page_regions:
    2:
      region: FrontMatter
      section: THE IAEA NUCLEAR SECURITY SERIES
    3: FrontMatter
    4: FrontMatter
    5: FrontMatter
    6: FrontMatter
    9: FrontMatter
    21: Glossary
    27: BackMatter
    28: BackMatter
    31: BackMatter
    32: BackMatter

  # These are the publication's only two notes. Street numbers in sales lists are not notes.
  footnote_pages: [11, 24]
