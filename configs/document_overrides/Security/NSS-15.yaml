      48:
        lines:
        - This publication provides recommendations to a
        - State for the nuclear security of nuclear or other
        - radioactive material that has been reported as being
        - out of regulatory control, as well as for material that
        - is lost, missing or stolen but has not been reported as
        - such, or has been otherwise discovered. It includes
        - recommendations for the detection and assessment
        - of alarms and alerts and for a graded response to
        - criminal or unauthorized acts with nuclear security
        - implications involving nuclear or other radioactive
        - material out of regulatory control. The recommended
        - actions cover the confirmation of a credible threat,
        - assessment and interdiction of an attempted act and
        - response to a nuclear security event.
