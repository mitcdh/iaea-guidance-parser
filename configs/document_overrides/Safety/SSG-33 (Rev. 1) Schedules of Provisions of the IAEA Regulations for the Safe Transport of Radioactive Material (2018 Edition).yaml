parser:
  # Schedule paragraph numbers restart for each UN entry. Preserve the printed
  # labels and attach a stable parent scope instead of inventing global IDs.
  local_scope_patterns:
    - pattern: '^SCHEDULE FOR UN (?P<scope>\d{4})(?::|$)'
      id_template: 'UN {scope}'
      case_sensitive: true
